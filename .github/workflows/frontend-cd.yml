name: "Frontend CD (Deploy to NGINX)"

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "IP Publico ou DNS da EC2 Frontend"
        required: true
        type: string
      ssh_user:
        description: "Usuario SSH da instancia"
        required: true
        default: "ubuntu"
        type: string

jobs:
  deploy:
    name: "Build Vite e Upload para /var/www/html via SCP"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Front-End/package-lock.json"

      - name: Instalar Dependencias
        run: npm ci

      - name: Build do Bundle React
        run: npm run build

      - name: Configurar Chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Transferir Artefatos e Recarregar NGINX
        env:
          TARGET: ${{ inputs.target_host }}
          USER: ${{ inputs.ssh_user }}
        run: |
          echo "Compactando dist/ temporariamente para transferencia rapida..."
          tar -czf dist.tar.gz -C dist .

          echo "Transferindo dist.tar.gz para a instancia $TARGET..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa dist.tar.gz ${USER}@${TARGET}:/tmp/dist.tar.gz

          echo "Extraindo para /var/www/html/ e recarregando o NGINX..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${USER}@${TARGET} << 'EOSSH'
            sudo rm -rf /var/www/html/*
            sudo tar -xzf /tmp/dist.tar.gz -C /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            sudo systemctl reload nginx
            sudo systemctl status nginx --no-pager
          EOSSH

          echo "✅ Deploy do Frontend concluído com sucesso!"
